name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site folder
        run: |
          mkdir /tmp/site
          rsync -a --exclude .git --exclude .github --exclude tools --exclude docs --exclude supabase --exclude node_modules ./ /tmp/site/
      - name: Deploy
        run: npx --yes wrangler@latest pages deploy /tmp/site --project-name=mobile-doctor-lucknow --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
